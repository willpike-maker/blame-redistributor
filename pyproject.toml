[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blame-redistributor"
version = "0.1.0"
authors = [
  { name="Will Pike", email="willpike@users.noreply.github.com" },
]
description = "Pareto-optimal culpability smoothing and egalitarian blame redistribution for Git."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
git-redistribute-blame = "blame_redistributor.cli:main"
